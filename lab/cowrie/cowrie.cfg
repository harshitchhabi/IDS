# Minimal Cowrie config for the lab. JSON logging is the channel the log tailer
# reads; the SSH listener is on 2222 (Cowrie runs unprivileged). Telnet off.
[honeypot]
hostname = svc-01
log_path = var/log/cowrie
download_path = var/log/cowrie/downloads
auth_class = UserDB

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = true

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.1

[telnet]
enabled = false
