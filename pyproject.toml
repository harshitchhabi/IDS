[project]
name = "dloop"
version = "0.0.0"
description = "Deception Loop — deception-aware NIDS and its adversarial research harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "torch>=2.4,<3",
    "structlog>=24.4,<26",
    # pyarrow (Parquet feature-batch store) lands with the Phase 0 loop simulator.
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "matplotlib>=3.9,<4",
    "tabulate>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
